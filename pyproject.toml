[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-pentest"
version = "0.2.0"
description = "Control plane MCP for scoped recon, triage, and bounded proofs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.9,<3",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/lutfizp/keel"
Issues = "https://github.com/lutfizp/keel/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keel-pentest = "keel.mcp_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
